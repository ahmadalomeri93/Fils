# مشروع تطبيق حوّش (فلس سابقاً) للآيفون — يتولّد بـXcodeGen (على سيرفر GitHub، لأن ماك 2018 ما يشغّل Xcode 26)
name: Hawwesh
options:
  bundleIdPrefix: com.yusfco
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
targets:
  Hawwesh:
    type: application
    platform: iOS
    sources:
      - path: Fils
        excludes:
          - "native-bridge.js"
          - "PrivacyInfo.xcprivacy"
      - path: Fils/native-bridge.js
        buildPhase: resources
      # Apple يطلب إعلان استخدام UserDefaults (CA92.1) وإلا يرفض الرفع لـApp Store Connect
      - path: Fils/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../dist
        name: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusfco.hawwesh
        PRODUCT_NAME: "Hawwesh"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "حوّش"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    info:
      path: Fils/Info.plist
      properties:
        CFBundleDisplayName: "حوّش"
        # بدونهم XcodeGen يكتب "1" و"1.0" ثابتين وكل رفع لـTestFlight يرفضه Apple لأنه نفس رقم البناء
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "حوّش يستخدم Face ID عشان يقفل بياناتك المالية."
        NSCameraUsageDescription: "حوّش يستخدم الكاميرا عشان تصوّر عقد القرض أو كشف الحساب."
        NSPhotoLibraryUsageDescription: "حوّش يحتاج الصور عشان تختار صورة عقد القرض أو المحفظة."
