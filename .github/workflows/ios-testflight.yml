# DRAFT: move to .github/workflows/ios-testflight.yml when the founder approves. Manual only.
# Archives the app and uploads it to TestFlight using Apple's cloud-managed signing (no certificates or
# provisioning profiles are stored anywhere; Xcode asks Apple for them with the App Store Connect API key).
#
# One-time setup by the founder (nothing here can be done by the agent):
#   1. Repository Settings > Environments > New environment named `appstore`. Add yourself as a required reviewer
#      and restrict deployment branches to the branch you release from.
#   2. Create the API key in App Store Connect > Users and Access > Integrations > App Store Connect API, on the
#      **Team Keys** tab, with Access = **Admin**. Why Admin and a team key (see "Sources" below for what is verified):
#        - Apple: Account Holder or Admin can cloud-sign for App Store distribution by default; a Developer needs the extra
#          permission "Access to Cloud Managed Distribution Certificate" (WWDC21 session 10204).
#        - Apple: only the Account Holder or an Admin can generate team keys.
#        - Apple: individual keys cannot use the Provisioning endpoints, so use a team key.
#        - UNVERIFIED: no Apple page I fetched says which role an API KEY needs for `xcodebuild -exportArchive` cloud signing.
#          A community report says a Developer or App Manager key fails with "Cloud signing permission error" and an Admin
#          key works. If a lower role is wanted later, test it on a throw-away run before relying on it.
#      Then in the `appstore` environment add three secrets:
#        APP_STORE_CONNECT_KEY_ID      the Key ID
#        APP_STORE_CONNECT_ISSUER_ID   the Issuer ID
#        APP_STORE_CONNECT_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file, including the
#                                      BEGIN/END lines
#      and one variable (not a secret, it is not sensitive):
#        APPLE_TEAM_ID                 the 10-character Team ID from developer.apple.com > Membership
#   3. Create the app record in App Store Connect with bundle id com.hawwesh.app first (it cannot be changed after the first upload).
#
# Action versions are pinned to commit SHAs (verified with `git ls-remote` on 2026-10-08), see ios-build.yml.
#
# Sources (only pages that were actually fetched on 2026-10-08; everything else below is marked unverified):
#   - xcodebuild flags -allowProvisioningUpdates, -authenticationKeyPath, -authenticationKeyID,
#     -authenticationKeyIssuerID, and the Admin/Account Holder cloud-signing default:
#     WWDC21 session 10204 "Distribute apps in Xcode with cloud signing" (transcript), https://developer.apple.com/videos/play/wwdc2021/10204/
#   - Cloud-managed certificates, "Required role: Account Holder or Admin":
#     https://developer.apple.com/help/account/certificates/cloud-managed-certificates/
#   - Team keys can be generated by Account Holder or Admin:
#     https://developer.apple.com/help/app-store-connect/get-started/app-store-connect-api/
#   - Team keys vs individual keys (individual keys cannot use Provisioning endpoints):
#     https://developer.apple.com/documentation/appstoreconnectapi/creating-api-keys-for-app-store-connect-api
#   - Community report (NOT Apple): Developer or App Manager key -> "Cloud signing permission error", Admin key works:
#     https://developer.apple.com/forums/thread/698117
# UNVERIFIED (no fetched Apple page documents them): the ExportOptions keys method=app-store-connect and
#   destination=upload, signingStyle, uploadSymbols; the API key role needed for cloud signing (see setup step 2); that
#   Xcode 26 on the macos-26 runner behaves like the Xcode 13 behaviour described in the 2021 session. The first run of this
#   workflow is the real check. The page https://developer.apple.com/documentation/xcode/distributing-your-app-for-beta-testing-and-releases
#   was checked and does NOT document these flags, so it is not cited.
name: iOS TestFlight upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (CFBundleVersion). Leave empty to use the run number.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    environment: appstore
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check the setup
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${TEAM_ID}" ] || missing="${missing} APPLE_TEAM_ID(variable)"
          [ -n "${APP_STORE_CONNECT_KEY_ID}" ] || missing="${missing} APP_STORE_CONNECT_KEY_ID"
          [ -n "${APP_STORE_CONNECT_ISSUER_ID}" ] || missing="${missing} APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${APP_STORE_CONNECT_KEY_P8}" ] || missing="${missing} APP_STORE_CONNECT_KEY_P8"
          if [ -n "${missing}" ]; then echo "::error::Missing in the appstore environment:${missing}"; exit 1; fi
          case "${BUILD_NUMBER}" in ''|*[!0-9]*) echo "::error::Build number must be a whole number"; exit 1;; esac
          echo "Build number: ${BUILD_NUMBER}"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Select the newest Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Using ${newest}"
          sudo xcode-select -s "${newest}/Contents/Developer"
          xcodebuild -version

      - name: Install native dependencies
        working-directory: native
        run: npm ci --ignore-scripts

      - name: Copy the web app into the iOS project
        working-directory: native
        run: |
          node scripts/stage-web.mjs
          npx cap sync ios
          node scripts/patch-ios.mjs --verify

      # After stage-web and cap sync on purpose: the tests read ios/App/App/capacitor.config.json and public/, which only
      # exist after the sync (both are git-ignored). Run before the sync they fail with ENOENT on a clean checkout.
      - name: Native project checks
        working-directory: native
        run: npm test

      - name: Write the App Store Connect key to a temporary file
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="${RUNNER_TEMP}/asc-key"
          mkdir -p "${key_dir}"
          key_file="${key_dir}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "${APP_STORE_CONNECT_KEY_P8}" > "${key_file}"
          chmod 600 "${key_file}"
          echo "ASC_KEY_FILE=${key_file}" >> "${GITHUB_ENV}"
          echo "ASC_KEY_DIR=${key_dir}" >> "${GITHUB_ENV}"

      - name: Archive
        working-directory: native
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/Hawwesh.xcarchive" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_FILE}" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Upload to TestFlight
        working-directory: native
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Hawwesh.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_FILE}" \
            -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"
          echo "Uploaded build ${BUILD_NUMBER}. It appears in TestFlight after Apple finishes processing (usually 5 to 30 minutes)."

      - name: Delete the key file
        if: always()
        shell: bash
        run: |
          rm -f "${ASC_KEY_FILE:-/nonexistent}" || true
          rm -rf "${ASC_KEY_DIR:-/nonexistent}" || true
