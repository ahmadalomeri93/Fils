# تجربة توقيع بدون جهاز مسجّل: الأرشيف بدون توقيع، والتوقيع (Apple Distribution عبر السحابة) يصير وقت التصدير.
# يدوي فقط. إذا نجح يرفع النسخة لـTestFlight مثل ios.yml.
name: iOS signing test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Archive without signing, then sign and upload while exporting
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'J7T6VDASDB' }}
        run: |
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "::error::App Store Connect secrets are missing or empty"; exit 1; }
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - "$KEY_PATH" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ.get("ASC_KEY_P8", "").replace("\\n", "\n")
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          if not m: sys.exit("::error::The App Store Connect private key secret is not a .p8 file")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1))
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          cd ios
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # xcodebuild: اطبع أسطر error: كملاحظات حتى لو الخطأ مدفون فوق آخر أسطر الناتج
          xc() { local out; out="$(mktemp)"; if "$@" > "$out" 2>&1; then tail -15 "$out"; else tail -40 "$out"; grep -E "error:|Error:" "$out" | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; return 1; fi; }
          xc xcodebuild -project Hawwesh.xcodeproj -scheme Hawwesh -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hawwesh.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          echo "::notice title=archive::unsigned archive built"
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xc xcodebuild -exportArchive -archivePath build/Hawwesh.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/export $AUTH
          echo "::notice title=testflight::export and upload finished"
          rm -f "$KEY_PATH"
