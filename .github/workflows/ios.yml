# يبني تطبيق حوّش للآيفون على ماك GitHub (Xcode 26)، ويرفعه لـTestFlight إذا مفاتيح Apple موجودة.
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [ios-app]
    paths: ["ios/**", "dist/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    # bash مع pipefail: بدونه "xcodebuild | tail" يرجّع نجاح حتى لو البناء فشل
    defaults:
      run:
        shell: bash
    env:
      HAS_APPLE_KEY: ${{ secrets.ASC_KEY_ID != '' || secrets.APP_STORE_CONNECT_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for simulator (check it compiles)
        if: env.HAS_APPLE_KEY != 'true'
        run: |
          cd ios
          xcodebuild -project Hawwesh.xcodeproj -scheme Hawwesh -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Check what is inside the app (privacy manifest and website files)
        if: env.HAS_APPLE_KEY != 'true'
        run: |
          app="$(find ios/build/dd -type d -name 'Hawwesh.app' | head -1)"
          test -n "$app" || { echo "::error::Hawwesh.app was not built"; exit 1; }
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is not inside the app"; exit 1; }
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          test -f "$app/dist/index.html" || { echo "::error::dist/index.html is not inside the app (the app would open blank)"; exit 1; }
          test -f "$app/native-bridge.js" || { echo "::error::native-bridge.js is not inside the app"; exit 1; }
          echo "App bundle OK: $app"

      - name: Open the app in the iPhone simulator and read the page state (smoke test)
        if: env.HAS_APPLE_KEY != 'true'
        run: |
          app="$(find ios/build/dd -type d -name 'Hawwesh.app' | head -1)"
          device="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")"
          echo "Simulator: $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b > /dev/null
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.yusfco.hawwesh -smoke
          data="$(xcrun simctl get_app_container "$device" com.yusfco.hawwesh data)"
          for i in $(seq 1 45); do [ -f "$data/Documents/smoke.json" ] && break; sleep 1; done
          if [ ! -f "$data/Documents/smoke.json" ]; then echo "::error::The app never wrote smoke.json (it did not finish loading the page)"; exit 1; fi
          report="$(cat "$data/Documents/smoke.json")"
          echo "::notice title=smoke-report::$report"
          python3 - "$report" <<'PY'
          import json, sys
          r = json.loads(sys.argv[1])
          problems = []
          if r.get("navigationError") or r.get("probeError"): problems.append(str(r))
          else:
              if r.get("bodyTextLength", 0) < 200: problems.append("the page is nearly empty")
              if r.get("localStorageWorks") is not True: problems.append("localStorage does not work: %s" % r.get("localStorageWorks"))
              if r.get("errors"): problems.append("page errors: %s" % r["errors"])
              if r.get("assistantNavDisplay") not in ("none", "missing") or r.get("assistantViewDisplay") not in ("none", "missing"): problems.append("the AI accountant is not hidden: %s / %s" % (r.get("assistantNavDisplay"), r.get("assistantViewDisplay")))
              if r.get("webOnlyShown", 0) > 0: problems.append("web-only elements are shown: %s" % r["webOnlyShown"])
          if problems:
              print("::error::" + "; ".join(problems)); sys.exit(1)
          print("smoke test passed")
          PY

      - name: Archive and upload to TestFlight
        if: env.HAS_APPLE_KEY == 'true'
        env:
          # يقبل الاسمين: ASC_* أو APP_STORE_CONNECT_* (حسب ما انحفظت الأسرار)
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # رقم الفريق مو سر (يطلع بصفحة المطور)، فله قيمة افتراضية
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'J7T6VDASDB' }}
        run: |
          # المسافات أو الأسطر الزايدة بالأسرار (من النسخ واللصق) تكسر المسار، فننظفها
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "::error::App Store Connect secrets are missing or empty"; exit 1; }
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # المفتاح ممكن ينحفظ PEM عادي، أو بسطر واحد (مسافات أو \n حرفية)، أو base64. نعيد بناءه PEM صحيح
          python3 - "$KEY_PATH" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ.get("ASC_KEY_P8", "").replace("\\n", "\n")
          if "BEGIN PRIVATE KEY" not in raw:
              try: raw = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
              except Exception: raw = ""
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          if not m: sys.exit("::error::The App Store Connect private key secret is not a .p8 file (no BEGIN/END PRIVATE KEY)")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(1))
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          echo "::notice::.p8 key looks valid ($(wc -l < "$KEY_PATH" | tr -d ' ') lines)"
          cd ios
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project Hawwesh.xcodeproj -scheme Hawwesh -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hawwesh.xcarchive \
            APPLE_TEAM_ID=$APPLE_TEAM_ID CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -20
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Hawwesh.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/export $AUTH | tail -20
          rm -f "$KEY_PATH"
